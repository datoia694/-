#coins-display{display:flex;align-items:center;padding:8px 16px 8px 12px;font:700 17px/1 var(--serif);color:var(--gold-l);border-radius:14px;background:linear-gradient(180deg,#0c2220,#081917);border:1px solid var(--line);box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.06)}
#coins-display .coin{width:22px;height:22px;margin-right:9px;vertical-align:0}
.nav-btn{display:flex;align-items:center;justify-content:center;width:52px;height:52px;padding:0;border-radius:14px;font-size:26px;color:var(--gold-l);cursor:pointer;background:linear-gradient(180deg,rgba(217,164,65,.2),rgba(217,164,65,.05));border:1px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.nav-btn img{width:38px;height:38px;object-fit:contain}
.nav-btn:active{transform:translateY(2px);box-shadow:none}
.gear-btn{width:46px;height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;cursor:pointer;color:#1d1405;background:linear-gradient(180deg,#f6d98f,#d9a441);box-shadow:0 0 0 2px #0b2220,0 0 0 3.5px rgba(217,164,65,.6),0 4px 10px rgba(0,0,0,.45)}
.gear-btn img{width:30px;height:30px;object-fit:contain;image-rendering:pixelated;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.gear-btn:hover img{transform:rotate(90deg)}
.gear-btn:active{transform:scale(.93)}
#word-builder-screen{min-height:64px;margin:44px 0 18px;padding:12px;display:flex;align-items:center;justify-content:center;font:700 26px/1.2 var(--serif);letter-spacing:7px;color:var(--ivory);border-radius:14px;background:#081917;border:1px solid var(--line);box-shadow:inset 0 3px 10px rgba(0,0,0,.65)}
#word-builder-screen.wrong{color:#f87171;border-color:#f87171;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.help-btn{position:relative;width:52px;height:52px;margin:0 auto 6px 22px;padding:0;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;cursor:pointer;background:linear-gradient(180deg,#f6d98f,#d9a441);box-shadow:0 4px 0 #8d6a22,0 10px 18px rgba(0,0,0,.35)}
.help-ico img{height:30px;width:auto;image-rendering:pixelated}
.help-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8d6a22}
.help-btn.poor{filter:grayscale(.8) brightness(.8)}
.help-ico{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:18px;background:rgba(255,255,255,.5)}
.help-cost{position:absolute;right:-11px;bottom:-5px;display:flex;align-items:center;padding:3px 7px 3px 5px;border-radius:999px;font:700 11px/1 var(--serif);color:var(--gold-l);background:#0b2220;box-shadow:0 0 0 2px #14532d,inset 0 2px 4px rgba(0,0,0,.6)}
.help-cost .coin{width:12px;height:12px;margin-right:4px;vertical-align:0}
.letters-circle-container{position:relative;width:280px;height:280px;flex-shrink:0;margin:auto auto 26px;border-radius:50%;touch-action:none;background:radial-gradient(circle 140px at center,transparent 104px,rgba(217,164,65,.28) 105px,rgba(217,164,65,.28) 106px,transparent 107px),radial-gradient(circle at center,rgba(143,209,176,.09),transparent 70%)}
.center-orb{position:absolute;top:50%;left:50%;width:84px;height:84px;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;border:1px dashed rgba(217,164,65,.4);background:radial-gradient(circle at 35% 30%,rgba(217,164,65,.14),rgba(5,20,18,.5))}
.letter-bubble{position:absolute;width:62px;height:62px;z-index:2;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;font:700 26px/1 var(--serif);color:var(--paper-ink);background:linear-gradient(160deg,#fbf5e4,#e4d6b0);box-shadow:0 5px 0 #a48c55,0 10px 16px rgba(0,0,0,.45),inset 0 1px 0 #fff;transform:translate(-50%,-50%);transition:background .15s,color .15s}
.letter-bubble.selected{color:var(--ivory);background:linear-gradient(160deg,#d0384e,var(--pom));box-shadow:0 5px 0 var(--pom-d),0 10px 16px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35);animation:pick .32s ease-out}
@keyframes pick{0%{transform:translate(-50%,-50%) scale(1);box-shadow:0 5px 0 var(--pom-d),0 0 0 0 rgba(208,56,78,.8)}45%{transform:translate(-50%,-50%) scale(1.2);box-shadow:0 5px 0 var(--pom-d),0 0 0 14px rgba(208,56,78,0)}100%{transform:translate(-50%,-50%) scale(1);box-shadow:0 5px 0 var(--pom-d),0 10px 16px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}}
#message{margin-top:8px;flex-shrink:0;min-height:20px;font-size:14px;font-weight:600}
#score{margin-top:8px;font-size:14px;font-weight:700;color:var(--gold-l)}
h1{font:800 22px/1.25 var(--serif);color:var(--gold-l);margin-bottom:16px}
.btn-compact{min-width:118px;padding:10px 16px;font-size:13px;font-weight:700;border:0;border-radius:12px;cursor:pointer}
.btn-compact:active{transform:translateY(2px)}
.btn-primary{color:#1d1405;background:linear-gradient(180deg,#f1cf86,#d9a441);box-shadow:0 3px 0 #8d6a22}
.btn-secondary{color:var(--text);background:transparent;border:1px solid rgba(255,255,255,.25)}
.modal{display:none;position:absolute;inset:0;z-index:10;padding:20px;border-radius:46px;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,20,18,.93);backdrop-filter:blur(10px)}
@media (max-width:500px){.modal{border-radius:0}}
.modal-card{position:relative;width:100%;max-width:360px;padding:24px;display:flex;flex-direction:column;align-items:center;border-radius:18px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);box-shadow:0 24px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
.modal h2{font:700 19px/1.3 var(--serif);margin-bottom:10px;color:var(--gold-l)}
#factModal{padding:12px}
.fact-wrap{display:flex;align-items:flex-end;gap:10px;width:100%;max-width:370px}
.peek{flex:0 0 132px;height:230px;overflow:hidden;border-radius:20px 20px 14px 14px;border:3px solid var(--gold);box-shadow:0 8px 18px rgba(0,0,0,.55);transform:rotate(-5deg);transform-origin:bottom left;animation:lean .45s cubic-bezier(.2,1.3,.4,1);display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#1d5049,#0b2220);font:800 90px/1 var(--serif);color:var(--gold-l)}
.peek img{width:100%;height:100%;object-fit:cover;object-position:50% 0}
@keyframes lean{from{transform:translateX(-120px) rotate(-18deg);opacity:0}to{transform:rotate(-5deg);opacity:1}}
.fact-bubble{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;text-align:center}
.praise{position:relative;padding:10px 8px;border-radius:16px;font:700 18px/1.2 var(--serif);color:var(--paper-ink);background:linear-gradient(160deg,#fbf5e4,#e4d6b0);box-shadow:0 4px 0 #a48c55}
.praise::before{content:"";position:absolute;left:-7px;bottom:12px;width:14px;height:14px;background:#ece0bf;transform:rotate(45deg)}
.answer-card{padding:12px 10px;border-radius:14px;background:#0a1f1d;border:1px solid var(--line)}
.fact-text{margin-top:8px;font-size:11.5px;line-height:1.5}
.progress-row{display:flex;align-items:center;gap:8px;font:700 12px var(--sans);color:var(--gold-l)}
.progress-bar{flex:1;height:12px;border-radius:8px;overflow:hidden;background:rgba(0,0,0,.45);border:1px solid var(--line)}
.progress-bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l));transition:width .6s}
.guessed-word{font:800 19px/1.3 var(--serif);color:var(--ivory);letter-spacing:2px;word-break:break-word}
.modal-desc{font-size:14px;line-height:1.6;margin-bottom:18px}
.close-x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--gold-l);font-size:14px}
.inventory-list{width:100%;max-height:230px;overflow-y:auto;margin-bottom:14px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.inventory-item{display:flex;align-items:center;gap:12px;padding:10px;text-align:left;border-radius:12px;background:#0a1f1d;border:1px solid rgba(217,164,65,.25)}
.inventory-img-box{width:52px;height:52px;flex-shrink:0;overflow:hidden;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#0a1f1d;border:1px solid var(--gold)}
.inventory-img-box img{width:100%;height:100%;object-fit:cover}
.garden-map-container{position:relative;width:100%;height:260px;margin-bottom:12px;overflow-y:auto;border-radius:14px;border:1px solid var(--line);background:linear-gradient(to top,#103a34,#0a2523);scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.map-scroll-content{position:relative;width:100%;height:480px}
.vertical-path{position:absolute;left:50%;transform:translateX(-50%);width:8px;height:100%;border-radius:4px;z-index:1;background:repeating-linear-gradient(0deg,rgba(217,164,65,.55) 0 12px,transparent 12px 22px)}
.map-node{position:absolute;z-index:2;width:42px;height:42px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px;font-weight:700;border:2px solid var(--ivory);box-shadow:0 4px 10px rgba(0,0,0,.45)}
.map-node.completed{background:#3f9c76;color:var(--ivory)}
.map-node.current{background:var(--gold);color:#1d1405;animation:pulse 1.6s infinite}
.map-node.locked{background:#2a4540;color:#8aa59f;border-color:#41625b}
@keyframes pulse{0%{transform:translateX(-50%) scale(1);box-shadow:0 0 0 0 rgba(217,164,65,.7)}70%{transform:translateX(-50%) scale(1.12);box-shadow:0 0 0 12px rgba(217,164,65,0)}100%{transform:translateX(-50%) scale(1);box-shadow:0 0 0 0 rgba(217,164,65,0)}}
.set-toggles{display:flex;gap:36px;margin:8px 0 22px}
.set-col{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600}
.round-toggle{width:68px;height:68px;border-radius:50%;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;background:#16a34a;border:2px solid #4ade80;box-shadow:0 4px 0 #166534}
.round-toggle:active{transform:translateY(2px);box-shadow:0 2px 0 #166534}
.round-toggle.off{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.4);box-shadow:0 4px 0 rgba(0,0,0,.3);color:#cbd5e1}
.round-toggle .slash{display:none}
.round-toggle.off .slash{display:block}
.set-row{width:100%;display:flex;align-items:center;gap:12px;margin-bottom:10px;padding:11px 16px;border-radius:999px;text-align:left;color:var(--text);font-size:14px;font-weight:700;cursor:pointer;background:rgba(6,24,21,.7);border:1px solid var(--line)}
.set-row small{display:block;margin-top:2px;font-size:12px;color:var(--gold)}
.set-row svg{flex-shrink:0;color:var(--gold-l)}
#howto{display:none;width:100%;font-size:12.5px;line-height:1.6;text-align:left}
#langList{display:none;gap:8px;width:100%;margin-bottom:10px}
.lang-opt{flex:1;padding:9px 4px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text);background:transparent;border:1px solid var(--line)}
.lang-opt.on{background:linear-gradient(180deg,#f6d98f,#d9a441);color:#1d1405;border-color:transparent}
button:focus-visible{outline:2px solid var(--gold-l);outline-offset:2px}
#intro{position:absolute;inset:0;z-index:30;border-radius:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;background:#0f2f2b;transition:opacity .5s}
#intro.hide{opacity:0;pointer-events:none}
@media (max-width:500px){#intro{border-radius:0}}
#introLetters{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#introLetters span{position:absolute;bottom:-60px;font-family:var(--serif);font-weight:800;color:rgba(241,207,134,.3);animation:floatUp linear infinite}
@keyframes floatUp{from{transform:translateY(0) rotate(-8deg);opacity:0}15%{opacity:1}to{transform:translateY(-820px) rotate(10deg);opacity:0}}
.intro-portrait{position:relative;width:110px;height:110px;margin-bottom:20px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 0 6px rgba(217,164,65,.2),0 10px 24px rgba(0,0,0,.5);animation:pop .6s}
.intro-portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
#intro h1{position:relative;font-size:36px;margin-bottom:4px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.intro-sub{position:relative;font:700 16px var(--serif);color:var(--ivory);letter-spacing:3px;margin-bottom:14px}
.intro-tag{position:relative;max-width:250px;margin-bottom:28px;font-size:12.5px;line-height:1.6;opacity:.9}
#introBtn{position:relative;min-width:160px;padding:13px 20px;font-size:15px}
.garden-map-container{height:340px;background:linear-gradient(#a6d764,#78b844)}
.map-scroll-content{width:100%;height:auto}
.vertical-path{display:none}
.map-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.map-decor{position:absolute;transform:translate(-50%,-50%);font-size:30px;line-height:1;pointer-events:none;z-index:1}
.map-node{width:48px;height:48px;transform:translate(-50%,-50%);font:800 20px var(--serif);color:#1b3a57;border:3px solid #fff;background:radial-gradient(circle at 35% 30%,#c9eeff,#3aa0e6 60%,#1d6fb0);box-shadow:0 5px 0 #1d5a8f,0 8px 12px rgba(0,0,0,.35)}
.map-node.completed{color:#1b3a57;background:radial-gradient(circle at 35% 30%,#c9eeff,#3aa0e6 60%,#1d6fb0)}
.map-node.current{color:#4a2f00;background:radial-gradient(circle at 35% 30%,#fff3c4,#f2b632 60%,#c98a12);box-shadow:0 5px 0 #8d6a22,0 8px 12px rgba(0,0,0,.35);animation:pulse2 1.6s infinite}
.map-node.locked{color:#5b6a73;border-color:#d8e0e5;background:radial-gradient(circle at 35% 30%,#dfe6ea,#9aa9b3 65%);box-shadow:0 5px 0 #6e7c85,0 8px 12px rgba(0,0,0,.3)}
.map-node .stars{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:14px;line-height:1;white-space:nowrap;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
@keyframes pulse2{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const LANG_NAMES = { ka: "ქართული", en: "English", ru: "Русский" };

const $ = id => document.getElementById(id);

/* შენახვა უსაფრთხოდ: თუ ბრაუზერი localStorage-ს არ იძლევა, თამაში მაინც მუშაობს */
const store = {
  get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
  set(key, val) { try { localStorage.setItem(key, val); } catch (e) {} },
  num(key, fallback) { const v = parseInt(store.get(key)); return isNaN(v) ? fallback : v; }
};

let levelIndex = store.num("de_levelIndex", 0);
let score = store.num("de_score", 0);
let coins = store.num("de_coins", 50);
let lang = store.get("de_lang");
if (!TEXT[lang]) lang = "ka";
if (levelIndex < 0) levelIndex = 0;

let words = [], wordIndex = 0, current = null;
let letters = [], picked = [], hintsUsed = 0;
let swiping = false, busy = false;

const t = key => TEXT[lang][key] || TEXT.ka[key];

function save() {
  store.set("de_levelIndex", levelIndex);
  store.set("de_score", score);
  store.set("de_coins", coins);
}

function shuffle(list) {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateCoins() {
  $("coins-display").innerHTML = `<i class="coin"></i>${coins}`;
  $("help-btn").classList.toggle("poor", coins < HINT_COST);
  save();
}

function say(text, color) {
  $("message").style.color = color;
  $("message").textContent = text;
}

function startLevel() {
  if (levelIndex >= levels.length) return showEnd();
  words = shuffle(levels[levelIndex].words);
  wordIndex = 0;
  loadWord();
}

function loadWord() {
  if (wordIndex >= words.length) return showReward();
  current = words[wordIndex];
  picked = [];
  hintsUsed = 0;
  busy = false;
  letters = shuffle(current.word.split(""));
  renderWord();
  renderBubbles();
  $("message").textContent = "";
}

function showEnd() {
  const card = document.querySelector(".game-card");
  [...card.children].filter(el => !el.classList.contains("modal")).forEach(el => el.remove());
  card.insertAdjacentHTML("afterbegin",
    `<h1 style="margin-top:40px">${t("congrats")}</h1>` +
    `<p style="margin:15px 0;font-size:15px">${t("congratsText")}</p>` +
    `<div id="score" style="font-size:17px">${t("finalScore")}: ${score} | ${t("coinsWord")}: ${coins}</div>` +
    `<div><button class="btn-compact btn-primary" style="margin-top:18px" onclick="openBag()">${t("seePhotos")}</button></div>`);
}

function renderWord() {
  $("word-builder-screen").textContent = picked.length
    ? picked.map(i => letters[i]).join(" ")
    : "_ ".repeat(current.word.length);
}

function renderBubbles() {
  const box = $("lettersContainer");
  box.innerHTML = '<div class="center-orb"></div>';
  const n = letters.length, radius = 106, center = 140;
  const size = Math.min(62, Math.floor(2 * radius * Math.sin(Math.PI / n)) - 4);

  letters.forEach((letter, i) => {
    const angle = (i * 2 * Math.PI) / n - Math.PI / 2;
    const el = document.createElement("div");
    el.className = "letter-bubble";
    el.textContent = letter;
    el.dataset.i = i;
    el.style.left = (center + radius * Math.cos(angle)) + "px";
    el.style.top = (center + radius * Math.sin(angle)) + "px";
    el.style.width = el.style.height = size + "px";
    el.style.fontSize = Math.round(size * 0.42) + "px";

    const start = e => { e.preventDefault(); swiping = true; pick(i, el); };
    el.addEventListener("mousedown", start);
    el.addEventListener("touchstart", start);
    el.addEventListener("mouseenter", () => { if (swiping) pick(i, el); });
    box.appendChild(el);
  });
}

function highlight() {
  document.querySelectorAll(".letter-bubble").forEach(b =>
    b.classList.toggle("selected", picked.includes(+b.dataset.i)));
}

function pick(i, el) {
  if (busy || picked.includes(i)) return;
  picked.push(i);
  el.classList.add("selected");
  renderWord();
  sfx("tap");
  if (picked.length === current.word.length) {
    busy = true;
    swiping = false;
    setTimeout(checkWord, 250);
  }
}

function endSwipe() {
  if (!swiping) return;
  swiping = false;
  if (busy || picked.length === 0) return;
  busy = true;
  setTimeout(() => { resetPicked(); busy = false; }, 150);
}

function resetPicked() {
  picked = picked.slice(0, hintsUsed);
  highlight();
  renderWord();
}

window.addEventListener("mouseup", endSwipe);
window.addEventListener("touchend", endSwipe);
window.addEventListener("touchcancel", endSwipe);
document.addEventListener("touchmove", e => {
  if (!swiping) return;
  e.preventDefault();
  const p = e.touches[0];
  const el = document.elementFromPoint(p.clientX, p.clientY);
  if (el && el.classList.contains("letter-bubble")) pick(+el.dataset.i, el);
}, { passive: false });

function useHint() {
  if (busy || hintsUsed >= current.word.length) return;
  if (coins < HINT_COST) return say(t("poor"), "#f87171");

  coins -= HINT_COST;
  sfx("hint");
  picked = picked.slice(0, hintsUsed);
  const needed = current.word[hintsUsed];
  const idx = letters.findIndex((l, i) => l === needed && !picked.includes(i));
  picked.push(idx);
  hintsUsed++;
  highlight();
  renderWord();
  updateCoins();

  if (picked.length === current.word.length) {
    busy = true;
    setTimeout(checkWord, 250);
  }
}

function checkWord() {
  const guess = picked.map(i => letters[i]).join("");
  if (guess === current.word) {
    score += 20;
    coins += 10;
    updateCoins();
    sfx("ok");
    $("factWord").textContent = current.word;
    $("factModalText").textContent = current.fact;
    $("factCount").textContent = (wordIndex + 1) + "/" + words.length;
    $("factBar").style.width = "0";
    setTimeout(() => { $("factBar").style.width = ((wordIndex + 1) / words.length * 100) + "%"; }, 80);
    $("factModal").style.display = "flex";
  } else {
    say(t("wrong"), "#f87171");
    $("word-builder-screen").classList.add("wrong");
    sfx("bad");
    setTimeout(() => {
      $("word-builder-screen").classList.remove("wrong");
      resetPicked();
      $("message").textContent = "";
      busy = false;
    }, 800);
  }
}

function closeFactModal() {
  $("factModal").style.display = "none";
  wordIndex++;
  loadWord();
}

function showReward() {
  const lvl = levels[levelIndex];
  $("rewardImgBox").innerHTML = PHOTOS[levelIndex] ? `<img src="${PHOTOS[levelIndex]}" alt="" style="object-position:50% 0;cursor:zoom-in" onclick="zoomPhoto(this.src)">` : `<span style="font:800 44px var(--serif);color:var(--gold-l)">${levelIndex + 1}</span>`;
  $("rewardDesc").innerHTML =
    `<strong>${lvl.photoTitle}</strong><br>${lvl.photoDesc}<br><br>` +
    `<span style="color:var(--mint)">${t("added")}</span>`;
  $("rewardModal").style.display = "flex";
  updateCoins();
}

function nextLevel() {
  $("rewardModal").style.display = "none";
  levelIndex++;
  startLevel();
}

function openMap() {
  const content = $("mapContent");
  const W = 300, STEP = 96, H = levels.length * STEP + 80;
  const xs = [0.68, 0.3, 0.62, 0.3];
  const pts = levels.map((_, i) => ({ x: xs[i % 4] * W, y: H - 60 - i * STEP }));
  let d = `M ${pts[0].x} ${H} L ${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < pts.length; i++) {
    const p = pts[i - 1], q = pts[i], my = (p.y + q.y) / 2;
    d += ` C ${p.x} ${my} ${q.x} ${my} ${q.x} ${q.y}`;
  }
  const last = pts[pts.length - 1];
  d += ` L ${last.x} 0`;
  content.innerHTML = `<svg class="map-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="#b98a3e" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#f0d98c" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  content.style.height = "auto";
  content.style.aspectRatio = W + " / " + H;
  const decor = ["🌲", "🌳", "🍄", "🌼", "🪨", "🌳"];
  pts.forEach((p, i) => {
    const left = p.x < W / 2;
    [[left ? 0.86 : 0.13, p.y + 34, decor[i % 6]], [left ? 0.93 : 0.07, p.y - 30, decor[(i + 3) % 6]]].forEach(([fx, y, ch]) => {
      const el = document.createElement("div");
      el.className = "map-decor";
      el.textContent = ch;
      el.style.left = (fx * 100) + "%";
      el.style.top = (y / H * 100) + "%";
      content.appendChild(el);
    });
  });
  pts.forEach((p, i) => {
    const node = document.createElement("div");
    node.id = "node-" + i;
    node.className = "map-node " + (i < levelIndex ? "completed" : i === levelIndex ? "current" : "locked");
    node.style.left = (p.x / W * 100) + "%";
    node.style.top = (p.y / H * 100) + "%";
    node.innerHTML = (i < levelIndex ? '<span class="stars">⭐⭐⭐</span>' : "") + (i + 1);
    content.appendChild(node);
  });
  $("mapStatusDesc").textContent = t("mapAt").replace("{n}", levelIndex + 1);
  $("mapModal").style.display = "flex";
  setTimeout(() => {
    const node = $("node-" + Math.min(levelIndex, levels.length - 1));
    if (node) $("mapContainer").scrollTop = node.offsetTop - 150;
  }, 50);
}
function openMapOld() {
  const content = $("mapContent");
  const xs = [62, 38, 50];
  content.style.height = (levels.length * 80 + 40) + "px";
  content.querySelectorAll(".map-node").forEach(n => n.remove());
  levels.forEach((_, i) => {
    const node = document.createElement("div");
    node.id = "node-" + i;
    node.className = "map-node";
    node.style.bottom = (20 + i * 80) + "px";
    node.style.left = xs[i % 3] + "%";
    if (i < levelIndex) { node.classList.add("completed"); node.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'; }
    else if (i === levelIndex) { node.classList.add("current"); node.textContent = i + 1; }
    else { node.classList.add("locked"); node.textContent = i + 1; }
    content.appendChild(node);
  });
  $("mapStatusDesc").textContent = t("mapAt").replace("{n}", levelIndex + 1);
  $("mapModal").style.display = "flex";
  setTimeout(() => {
    const node = $("node-" + Math.min(levelIndex, levels.length - 1));
    if (node) $("mapContainer").scrollTop = node.offsetTop - 80;
  }, 50);
}
function closeMap() { $("mapModal").style.display = "none"; }

function openBag() {
  const list = $("inventoryList");
  list.innerHTML = "";
  levels.forEach((lvl, i) => {
    const row = document.createElement("div");
    row.className = "inventory-item";
    if (i < levelIndex) {
      row.innerHTML =
        `<div class="inventory-img-box">${PHOTOS[i] ? `<img src="${PHOTOS[i]}" alt="" style="object-position:50% 0;cursor:zoom-in" onclick="zoomPhoto(this.src)">` : `<span style="font:800 20px var(--serif);color:var(--gold-l)">${i + 1}</span>`}</div>` +
        `<div><h4 style="color:var(--gold-l);font-size:12px">${lvl.photoTitle}</h4>` +
        `<p style="font-size:11px;opacity:.85">${lvl.photoDesc}</p></div>`;
    } else {
      row.innerHTML =
        `<div class="inventory-img-box" style="border-color:#41625b;color:#8aa59f;font:800 20px var(--serif)">${i + 1}</div>` +
        `<div><h4 style="color:#8aa59f;font-size:12px">${t("locked").replace("{n}", i + 1)}</h4>` +
        `<p style="color:#6b8680;font-size:11px">${t("lockedHint")}</p></div>`;

    list.appendChild(row);
  });
  $("bagModal").style.display = "flex";
}
function zoomPhoto(src) { const m = $("photoModal"); m.querySelector("img").src = src; m.style.display = "flex"; }
function closeBag() { $("bagModal").style.display = "none"; }

/* ხმა და მუსიკა (Web Audio) */
let audio = null, musicBus = null, musicTimer = null, chordIndex = 0;
let musicOn = store.get("de_music") !== "0";
let soundOn = store.get("de_sound") !== "0";

function ctx() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === "suspended") audio.resume();
  return audio;
}

function tone(freq, start, dur, type, vol, dest) {
  const a = ctx(), osc = a.createOscillator(), gain = a.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(vol, start + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain);
  gain.connect(dest || a.destination);
  osc.start(start);
  osc.stop(start + dur + 0.05);
}

const SCALE = [392, 440, 494, 587, 659, 740, 784, 880, 988, 1047, 1175, 1319, 1397];

function sfx(name) {
  if (!soundOn) return;
  const now = ctx().currentTime;
  if (name === "tap") {
    tone(SCALE[Math.min(picked.length - 1, SCALE.length - 1)], now, 0.28, "sine", 0.14);
  } else if (name === "ok") {
    [523.3, 659.3, 784, 1046.5].forEach((f, i) => tone(f, now + i * 0.09, 0.6, "triangle", 0.14));
  } else if (name === "bad") {
    tone(220, now, 0.28, "sine", 0.16);
    tone(165, now + 0.12, 0.4, "sine", 0.16);
  } else if (name === "hint") {
    tone(880, now, 0.35, "sine", 0.13);
    tone(1174.7, now + 0.12, 0.5, "sine", 0.13);
  }
}

const CHORDS = [
  [130.8, 261.6, 329.6, 392, 493.9],
  [110, 220, 261.6, 329.6, 392],
  [87.3, 174.6, 261.6, 329.6, 440],
  [98, 196, 293.7, 392, 493.9]
];
const BELLS = [523.3, 587.3, 659.3, 784, 880];

function pad(freq, start, dur) {
  const a = ctx(), osc = a.createOscillator(), gain = a.createGain();
  osc.type = "sine";
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(0.5, start + 2);
  gain.gain.linearRampToValueAtTime(0, start + dur);
  osc.connect(gain);
  gain.connect(musicBus);
  osc.start(start);
  osc.stop(start + dur + 0.1);
}

function startMusic() {
  if (!musicOn || musicTimer) return;
  const a = ctx();
  if (!musicBus) {
    musicBus = a.createGain();
    musicBus.gain.value = 0;
    const delay = a.createDelay(1), feedback = a.createGain();
    delay.delayTime.value = 0.5;
    feedback.gain.value = 0.4;
    musicBus.connect(a.destination);
    musicBus.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(a.destination);
  }
  musicBus.gain.setTargetAtTime(0.07, a.currentTime, 0.4);

  const playChord = () => {
    const start = a.currentTime + 0.05;
    CHORDS[chordIndex % CHORDS.length].forEach(f => pad(f, start, 7));
    for (let k = 0; k < 2; k++) {
      tone(BELLS[Math.floor(Math.random() * BELLS.length)], start + 1.2 + k * 2.1, 2.6, "triangle", 0.5, musicBus);
    }
    chordIndex++;
  };
  playChord();
  musicTimer = setInterval(playChord, 6000);
}

function stopMusic() {
  clearInterval(musicTimer);
  musicTimer = null;
  if (musicBus) musicBus.gain.setTargetAtTime(0, audio.currentTime, 0.15);
}

["pointerdown", "touchend", "click"].forEach(ev =>
  document.addEventListener(ev, () => { if (musicOn) startMusic(); }));

function refreshToggles() {
  $("musicBtn").classList.toggle("off", !musicOn);
  $("soundBtn").classList.toggle("off", !soundOn);
}
function toggleMusic() {
  musicOn = !musicOn;
  store.set("de_music", musicOn ? "1" : "0");
  musicOn ? startMusic() : stopMusic();
  refreshToggles();
}
function toggleSound() {
  soundOn = !soundOn;
  store.set("de_sound", soundOn ? "1" : "0");
  refreshToggles();
  if (soundOn) sfx("hint");
}
function openSettings() { refreshToggles(); $("settingsModal").style.display = "flex"; }
function closeSettings() { $("settingsModal").style.display = "none"; }
function toggleHowto() { const el = $("howto"); el.style.display = el.style.display === "block" ? "none" : "block"; }
function toggleLangList() { const el = $("langList"); el.style.display = el.style.display === "flex" ? "none" : "flex"; }

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $("langName").textContent = LANG_NAMES[lang];
  document.querySelectorAll(".lang-opt").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
}
function setLang(l) {
  lang = l;
  store.set("de_lang", l);
  applyLang();
}

refreshToggles();
applyLang();
updateCoins();
startLevel();
